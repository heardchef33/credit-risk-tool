name: Keep API warm (backup)

# Render's free tier spins the API down after 15 minutes without traffic.
# The primary keep-alive should be an external uptime monitor (UptimeRobot or
# cron-job.org) hitting /api/v1/health every 5-10 minutes, because GitHub can
# delay scheduled workflows by 10+ minutes. This workflow is a free backup.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://credit-risk-tool.onrender.com/api/v1/health' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors \
               --max-time 120 "$API_HEALTH_URL"
