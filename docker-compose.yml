services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Keep the container's own virtualenv instead of the bind-mounted host folder.
      - /app/.venv
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      # Inside Docker, "localhost" is the frontend container itself, so point
      # the app at the api service by its compose name.
      - BACKEND_URL=http://api:8000/api/v1
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      api:
        condition: service_healthy
